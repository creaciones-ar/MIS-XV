<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Nicole</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente elegante para títulos -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Pantalla de Inicio / Reproductor de Música -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
            <h1>Mis 15 Años</h1>
            <h2>Nicole</h2>
            <p>Haz clic para abrir la invitación</p>
            <button id="open-btn" class="btn-open">Abrir Invitación</button>
        </div>
    </div>

    <!-- Audio de fondo -->
    <audio id="background-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Contenido Principal de la Invitación -->
    <main id="main-content" class="hidden">
        
        <!-- Sección de Portada -->
        <header class="hero-section" style="background-image: url('imagenprimera.jpg');">
            <div class="hero-overlay">
                <h1>Nicole</h1>
                <p class="subtitle">¡Estás invitado a celebrar mis 15 años!</p>
            </div>
        </header>

        <!-- Sección Cuenta Regresiva -->
        <section class="countdown-section" style="background-image: url('contador.jpg');">
            <h2>Faltan...</h2>
            <div id="countdown" class="countdown-grid">
                <div class="time-box"><span id="days">00</span><p>Días</p></div>
                <div class="time-box"><span id="hours">00</span><p>Horas</p></div>
                <div class="time-box"><span id="minutes">00</span><p>Minutos</p></div>
                <div class="time-box"><span id="seconds">00</span><p>Segundos</p></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
